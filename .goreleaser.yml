version: 2
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.revision={{.ShortCommit}}

archives:
  - formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - packaging/ipneigh_exporter.service
      - packaging/ipneigh_exporter.default

checksum:
  name_template: checksums.txt
